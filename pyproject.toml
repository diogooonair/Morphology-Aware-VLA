[project]
name = "lerobot_policy_urdf_injection_smolvla"
version = "0.1.0"
description = "URDF Injection extension for Hugging Face LeRobot SmolVLA policy"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "lerobot",
    "networkx",
    "numpy",
    "torch",
]

dynamic = []
classifiers = [
    "Private :: Do Not Publish",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lerobot_policy_urdf_injection_smolvla"]